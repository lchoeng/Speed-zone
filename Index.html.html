<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speed Zone ’94</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b2f9e;--pink:#e8001c;--cyan:#8fd3ff;--yel:#ffd400;--ink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Press Start 2P",ui-monospace,Menlo,monospace;text-align:center;user-select:none;-webkit-user-select:none;padding:16px 12px 28px}
[hidden]{display:none!important}
h1{font-size:clamp(16px,5vw,28px);line-height:1.4;margin:8px 0 6px;color:var(--yel);text-shadow:3px 3px 0 var(--pink),6px 6px 0 #001a66}
p{font-size:9px;line-height:1.9;margin:8px auto;max-width:560px}
.sub{color:var(--cyan);margin:14px 0}
#grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px;margin:0 auto}
.rd{font:inherit;font-size:9px;color:var(--ink);background:#1446c8;border:3px solid var(--cyan);padding:8px 6px 6px;width:84px;cursor:pointer;box-shadow:3px 3px 0 var(--pink)}
.rd:hover,.rd:focus-visible{background:#2a6bff;outline:none;border-color:var(--yel);transform:translateY(-2px)}
.rd canvas{display:block;margin:0 auto 6px;image-rendering:pixelated}
#cv{display:block;width:100%;max-width:720px;aspect-ratio:9/5;margin:0 auto;image-rendering:pixelated;border:4px solid var(--pink);box-shadow:0 0 22px #ffd40080;touch-action:manipulation;background:#000}
#back{font:inherit;font-size:9px;color:var(--bg);background:var(--cyan);border:0;padding:10px 14px;margin-top:10px;cursor:pointer;box-shadow:3px 3px 0 var(--pink)}
.leg{color:var(--yel)}
.rd.on{border-color:var(--yel);background:#2a6bff;transform:translateY(-2px)}
.bk{width:auto;min-width:104px;line-height:1.6}
.sw{display:inline-block;width:10px;height:10px;margin-right:6px;border:1px solid #fff}
#go{font:inherit;font-size:12px;color:#fff;background:var(--pink);border:3px solid var(--yel);padding:12px 20px;margin-top:16px;cursor:pointer;box-shadow:3px 3px 0 #001a66}
</style>
</head>
<body>
<div id="sel">
  <h1>SPEED ZONE ’94</h1>
  <p class="sub">Pick your rider</p>
  <div id="grid"></div>
  <p class="sub">Pick your bike</p>
  <div id="bikes" style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px;margin:0 auto"></div>
  <button id="go">RIDE!</button>
  <p>Jump over traffic, trash cans and bums. Grab a donut for a heart. Grab a coffee for turbo.</p>
</div>
<div id="game" hidden>
  <canvas id="cv" width="360" height="200"></canvas>
  <p class="leg">Tap or Space to jump. Hold longer to jump higher.</p>
  <p>🍩 = +1 life &nbsp; ☕ = turbo &nbsp; 💍 = rings protect you</p>
  <button id="back">Change rider</button>
</div>
<script>
const C=[{n:'Almar',j:'#e53935',h:'#ffeb3b'},{n:'Andy',j:'#1e88e5',h:'#ffffff'},{n:'Anthony',j:'#43a047',h:'#212121'},{n:'Billy',j:'#fb8c00',h:'#1e88e5'},{n:'Kat',j:'#ec407a',h:'#7e57c2'},{n:'David',j:'#8e24aa',h:'#ffeb3b'},{n:'Loni',j:'#00acc1',h:'#ff7043'}];
const BK=[{b:'Specialized',n:'Tarmac SL8',f:'#7a1230',a:'#d0d0d0'},{b:'Factor',n:'Ostro VAM',f:'#f4f4f4',a:'#222',o:'#333'},{b:'Cervelo',n:'S5',f:'#1a1a1a',a:'#e53935',o:'#fff'},{b:'Canyon',n:'Ultimate',f:'#1565c0',a:'#fff'},{b:'Trek',n:'Madone SL7',f:'#d50000',a:'#111'}];
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const W=360,H=200,B=186,HZ=150,PX=64;
let ch=C[0],bk=BK[0],rings=0,st='select',o=[],py=B,vy=0,lives=3,score=0,dist=0,speed=150,turbo=0,inv=0,t=0,next=300,hi=0,AC,shake=0,overT=0;
try{hi=+localStorage.getItem('tt_hi')||0}catch(e){}

function bp(f,d,ty,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const a=AC.createOscillator(),b=AC.createGain();a.type=ty||'square';a.frequency.value=f;b.gain.value=v||.04;a.connect(b);b.connect(AC.destination);a.start();b.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);a.stop(AC.currentTime+d)}catch(e){}}

function rider(g,x,y,c,tm,s){
  g.save();g.translate(x,y);g.scale(s,s);
  const R=(a,b,w,h,f)=>{g.fillStyle=f;g.fillRect(a,b,w,h)};
  for(const wx of[-12,12]){
    g.strokeStyle='#eee';g.lineWidth=2;g.beginPath();g.arc(wx,-7,6,0,7);g.stroke();
    const a=tm*10;g.strokeStyle=bk.a;g.lineWidth=1;g.beginPath();g.moveTo(wx+Math.cos(a)*6,-7+Math.sin(a)*6);g.lineTo(wx-Math.cos(a)*6,-7-Math.sin(a)*6);g.stroke();
  }
  for(const[lw,sc]of bk.o?[[4,bk.o],[2,bk.f]]:[[2,bk.f]]){g.strokeStyle=sc;g.lineWidth=lw;g.beginPath();
  g.moveTo(-12,-7);g.lineTo(-3,-16);g.lineTo(8,-16);g.lineTo(12,-7);g.moveTo(-3,-16);g.lineTo(0,-7);g.lineTo(-12,-7);g.moveTo(0,-7);g.lineTo(8,-16);g.stroke();}
  const l=Math.sin(tm*10)*3;
  R(-2+l,-15,3,8,'#ffd7a8');R(-2-l,-15,3,8,'#d9a878');
  R(-4,-27,9,12,c.j);R(4,-25,8,3,c.j);
  R(-1,-34,8,7,'#ffd7a8');R(-2,-36,10,4,c.h);
  g.restore();
}

function spawn(){
  const r=Math.random(),x=W+20,hi_=Math.random()<.5?4:52;
  if(r<.08)o.push({k:'donut',x,y:B-hi_,w:14,h:14});
  else if(r<.4){for(let i=0;i<3;i++)o.push({k:'ring',x:x+i*18,y:B-hi_-(i==1?6:0),w:10,h:10})}
  else if(r<.46)o.push({k:'coffee',x,y:B-hi_,w:13,h:14});
  else{
    const k=['car','truck','can','bum'][Math.random()*4|0];
    const d={car:[38,16],truck:[48,28],can:[12,16],bum:[17,14]}[k];
    o.push({k,x,y:B,w:d[0],h:d[1],c:['#e53935','#fdd835','#29b6f6','#66bb6a','#ab47bc'][Math.random()*5|0]});
  }
  next=dist+190+Math.random()*150+speed*.35;
}

function start(c){
  if(c)ch=c;
  o=[];py=B;vy=0;lives=3;rings=0;score=0;dist=0;speed=150;turbo=0;inv=0;t=0;next=300;shake=0;st='play';
  document.getElementById('sel').hidden=true;document.getElementById('game').hidden=false;
}
function over(){
  st='over';overT=Date.now();
  if(score>hi){hi=score;try{localStorage.setItem('tt_hi',String(Math.floor(hi)))}catch(e){}}
  bp(150,.5,'sawtooth',.06);
}
function jump(){
  if(st=='over'){if(Date.now()-overT>500)start();return}
  if(st!='play')return;
  if(py>=B-1){vy=-380;bp(520,.12);bp(780,.1)}
}
function rel(){if(vy<-160)vy=-160}

function upd(d){
  t+=d;speed=Math.min(150+t*4,300);
  const sp=speed*(turbo>0?1.5:1);dist+=sp*d;
  if(dist>=next)spawn();
  vy+=1100*d;py+=vy*d;if(py>=B){py=B;vy=0}
  turbo=Math.max(0,turbo-d);inv=Math.max(0,inv-d);shake=Math.max(0,shake-d);score+=sp*d/10;
  for(const e of o){
    e.x-=sp*d;
    if(e.dead){e.x+=sp*d+160*d;e.y+=e.vy*d;e.vy+=800*d}
  }
  const hb={x:PX-9,y:py-26,w:18,h:24};
  for(const e of o){
    if(e.dead||e.got)continue;
    const s=(e.k=='donut'||e.k=='coffee'||e.k=='ring')?0:3;
    const ex=e.x+s,ey=e.y-e.h+s,ew=e.w-2*s,eh=e.h-2*s;
    if(hb.x<ex+ew&&hb.x+hb.w>ex&&hb.y<ey+eh&&hb.y+hb.h>ey){
      if(e.k=='ring'){e.got=1;rings++;score+=10;bp(1500,.08)}
      else if(e.k=='donut'){e.got=1;lives=Math.min(5,lives+1);score+=50;bp(880,.12);bp(1320,.2)}
      else if(e.k=='coffee'){e.got=1;turbo=5;score+=50;bp(660,.3,'sawtooth')}
      else if(turbo>0){e.dead=1;e.vy=-220;score+=100;bp(220,.15)}
      else if(inv<=0){inv=1.5;shake=.25;bp(110,.3,'sawtooth',.07);if(rings>0)rings=0;else{lives--;if(lives<=0)over()}}
    }
  }
  o=o.filter(e=>e.x>-80&&!e.got&&e.y<H+80);
}

// background
const bl=[];for(let x=0,i=0;x<720;i++){const w=18+(i*7%17),h=22+(i*13%48);bl.push({x,w,h,i});x+=w+2}
function bg(){
  const gr=g.createLinearGradient(0,0,0,HZ);gr.addColorStop(0,'#1f5cff');gr.addColorStop(1,'#9fe0ff');
  g.fillStyle=gr;g.fillRect(0,0,W,HZ);
  g.fillStyle='#fff';
  for(let i=0;i<5;i++){const x=((i*110-dist*.05)%440+440)%440-60,y=18+i*13%40;g.fillRect(x,y,34,8);g.fillRect(x+6,y-5,22,6);g.fillRect(x+22,y+4,20,6)}
  const o1=(dist*.12)%180;g.fillStyle='#3f9bff';
  for(let x=-o1-90;x<W+90;x+=180){g.beginPath();g.moveTo(x,HZ-6);g.lineTo(x+90,HZ-70);g.lineTo(x+180,HZ-6);g.fill()}
  const o2=(dist*.3)%140;g.fillStyle='#2fbf3a';
  for(let x=-o2-70;x<W+70;x+=140){g.beginPath();g.arc(x+70,HZ+10,46,Math.PI,0);g.fill()}
  const o3=(dist*.5)%90;
  for(let x=-o3;x<W+90;x+=90){g.fillStyle='#1f8f2a';g.fillRect(x+3,HZ-14,2,14);g.fillStyle='#ffd400';g.fillRect(x-1,HZ-20,10,6);g.fillStyle='#8b4513';g.fillRect(x+2,HZ-18,4,2)}
  g.fillStyle='#2fbf3a';g.fillRect(0,HZ,W,8);g.fillStyle='#1b7a24';g.fillRect(0,HZ+6,W,2);
  g.fillStyle='#5b5f73';g.fillRect(0,HZ+8,W,B-HZ-8);
  g.fillStyle='#fff';g.fillRect(0,HZ+8,W,1);
  g.fillStyle='#ffd400';for(let x=-(dist%48);x<W;x+=48)g.fillRect(x,170,24,2);
  const ck=dist%28;
  for(let i=0;i<28;i++)for(let r=0;r<2;r++){g.fillStyle=(i+r)&1?'#c8761a':'#8c4a0f';g.fillRect(i*14-ck,B+r*7,14,7)}
}
function bgOld(){
  const gr=g.createLinearGradient(0,0,0,HZ);gr.addColorStop(0,'#1a0b3d');gr.addColorStop(.55,'#c2278f');gr.addColorStop(1,'#ff9a3c');
  g.fillStyle=gr;g.fillRect(0,0,W,HZ);
  g.fillStyle='#fff';for(let i=0;i<28;i++)g.fillRect((i*97)%W,(i*53)%60,1,1);
  g.fillStyle='#ffe45e';g.beginPath();g.arc(250,98,32,0,7);g.fill();
  g.fillStyle='rgba(120,20,110,.75)';for(let i=0;i<5;i++)g.fillRect(214,102+i*7,72,2+i);
  const off=(dist*.15)%720;
  for(const k of[-off,720-off])for(const b of bl){
    const x=b.x+k;if(x>W||x+b.w<0)continue;
    g.fillStyle='#1b0a33';g.fillRect(x,HZ-b.h,b.w,b.h);
    g.fillStyle=b.i%2?'#ff4fd8':'#38f0ff';g.fillRect(x+3,HZ-b.h+6,2,2);g.fillRect(x+b.w-6,HZ-b.h+14,2,2);
  }
  g.fillStyle='#6b3fa0';g.fillRect(0,HZ,W,8);
  g.fillStyle='#25233a';g.fillRect(0,HZ+8,W,H-HZ-8);
  g.fillStyle='#ff3df0';g.fillRect(0,HZ+8,W,2);
  g.fillStyle='#38f0ff';g.fillRect(0,H-4,W,2);
  g.fillStyle='#ffe45e';for(let x=-(dist%48);x<W;x+=48)g.fillRect(x,170,24,2);
}

function ob(e){
  const{x,y,w,h}=e;
  const R=(a,b,ww,hh,f)=>{g.fillStyle=f;g.fillRect(x+a,y-h+b,ww,hh)};
  if(e.dead)g.globalAlpha=.65;
  if(e.k=='car'){R(0,6,w,h-9,e.c);R(8,0,22,8,e.c);R(10,2,8,5,'#bfe9ff');R(20,2,8,5,'#bfe9ff');R(0,8,3,3,'#fff59d');R(4,h-6,8,6,'#111');R(w-13,h-6,8,6,'#111')}
  else if(e.k=='truck'){R(0,8,14,h-14,e.c);R(2,10,6,6,'#bfe9ff');R(15,0,w-15,h-6,'#f5f5f5');R(15,10,w-15,3,e.c);R(4,h-6,8,6,'#111');R(w-22,h-6,8,6,'#111');R(w-11,h-6,8,6,'#111')}
  else if(e.k=='can'){R(0,0,w,4,'#b0b0b0');R(2,4,w-4,h-4,'#757575');R(4,6,1,h-8,'#4a4a4a');R(7,6,1,h-8,'#4a4a4a')}
  else if(e.k=='bum'){R(2,5,12,9,'#6d4c41');R(4,0,8,6,'#e0b48a');R(3,0,10,2,'#c62828');R(13,6,4,8,'#d7b377')}
  else if(e.k=='ring'){const cy=y-5+Math.sin(t*6+e.x*.05)*2,sq=Math.abs(Math.cos(t*5+e.x*.1));g.strokeStyle='#ffd400';g.lineWidth=3;g.beginPath();g.ellipse(x+5,cy,1+4*sq,5,0,0,7);g.stroke()}
  else if(e.k=='donut'){
    const cy=y-7+Math.sin(t*6+e.x*.05)*2;
    g.lineWidth=6;g.strokeStyle='#e8a86a';g.beginPath();g.arc(x+7,cy,4,0,7);g.stroke();
    g.lineWidth=4;g.strokeStyle='#f06292';g.beginPath();g.arc(x+7,cy,4,0,7);g.stroke();
    g.fillStyle='#fff';g.fillRect(x+3,cy-5,1,1);g.fillRect(x+10,cy-4,1,1);g.fillRect(x+11,cy+2,1,1);g.fillRect(x+4,cy+4,1,1);
  }
  else if(e.k=='coffee'){
    const b=Math.sin(t*6+e.x*.05)*2;g.save();g.translate(0,b);
    R(1,5,9,9,'#fff');R(1,8,9,3,'#8d5524');R(0,4,11,2,'#6d4c41');R(10,7,3,2,'#fff');R(12,7,1,5,'#fff');R(10,11,3,1,'#fff');
    if(Math.floor(t*4)%2){R(3,0,1,3,'#fff');R(7,1,1,3,'#fff')}else{R(4,0,1,3,'#fff');R(6,1,1,3,'#fff')}
    g.restore();
  }
  g.globalAlpha=1;
}

function tx(s,x,y,sz,col,al){
  g.font=sz+'px "Press Start 2P",monospace';g.textAlign=al||'left';
  g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle=col||'#fff';g.fillText(s,x,y);
}
const HP=['0110110','1111111','1111111','0111110','0011100','0001000'];
function heart(x,y,col){g.fillStyle=col;HP.forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]=='1')g.fillRect(x+i,y+j,1,1)})}

function draw(){
  g.save();
  if(shake>0)g.translate((Math.random()-.5)*5,(Math.random()-.5)*5);
  bg();
  for(const e of o)ob(e);
  const c=turbo>0?{j:Math.floor(t*12)%2?'#ffd400':'#fff6a0',h:'#ffd400'}:ch;
  if(turbo>0){g.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<6;i++)g.fillRect(((i*61)-dist*1.5)%W+W*(((i*61)-dist*1.5)%W<0?1:0),HZ+14+i*6,22,1)}
  if(!(inv>0&&Math.floor(t*14)%2))rider(g,PX,py,c,py<B?0:t,1);
  g.restore();
  tx('SCORE '+String(Math.floor(score)).padStart(5,'0'),8,16,9);
  tx('HI '+String(Math.floor(hi)).padStart(5,'0'),W-8,16,9,'#ffe45e','right');
  for(let i=0;i<lives;i++)heart(8+i*10,22,'#ff3d5a');
  tx('RINGS '+rings,8,42,8,'#ffd400');
  if(turbo>0){tx('TURBO',W/2,16,9,'#38f0ff','center');g.fillStyle='#38f0ff';g.fillRect(W/2-30,20,60*turbo/5,3)}
  tx(ch.n.toUpperCase()+' ON '+bk.n.toUpperCase(),8,H-4,7,'#fff');
  if(st=='play'&&t<3.5)tx('TAP / SPACE = JUMP',W/2,70,10,'#fff','center');
  if(st=='over'){
    g.fillStyle='rgba(10,0,30,.72)';g.fillRect(0,0,W,H);
    tx('LOSER!!',W/2,80,18,'#ff3df0','center');
    tx('SCORE '+Math.floor(score),W/2,108,10,'#fff','center');
    tx(score>=hi?'NEW HIGH SCORE!':'HI '+Math.floor(hi),W/2,126,9,'#ffe45e','center');
    tx('TAP TO RIDE AGAIN',W/2,158,9,'#38f0ff','center');
  }
}

let last=0;
function loop(ts){const d=Math.min((ts-last)/1000||0,.05);last=ts;if(st=='play')upd(d);if(st!='select')draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// character select
const grid=document.getElementById('grid'),cvs=[],bks=[];
function sel(){cvs.forEach(([x,c,b])=>{x.clearRect(0,0,64,52);rider(x,32,46,c,0,1.15);b.classList.toggle('on',c==ch)});bks.forEach(([b,k])=>b.classList.toggle('on',k==bk))}
C.forEach(c=>{
  const b=document.createElement('button');b.className='rd';
  const k=document.createElement('canvas');k.width=64;k.height=52;
  const x=k.getContext('2d');
  b.append(k,c.n);b.onclick=()=>{ch=c;sel();bp(660,.1)};cvs.push([x,c,b]);grid.append(b);
});
BK.forEach(k=>{const b=document.createElement('button');b.className='rd bk';b.innerHTML=`<span class="sw" style="background:${k.f}"></span>${k.b}<br>${k.n}`;b.onclick=()=>{bk=k;sel();bp(880,.1)};bks.push([b,k]);document.getElementById('bikes').append(b)});
document.getElementById('go').onclick=()=>{start();bp(660,.1);bp(990,.15)};sel();
document.getElementById('back').onclick=()=>{sel();st='select';document.getElementById('game').hidden=true;document.getElementById('sel').hidden=false};

addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))rel()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
addEventListener('pointerup',rel);
</script>
</body>
</html>
